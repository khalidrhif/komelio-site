
name: Collecte automatique des evenements

on:
  schedule:
    - cron: '0 11 * * *'
      timezone: America/Toronto
  workflow_dispatch:

concurrency:
  group: komelio-automatisations
  cancel-in-progress: false

permissions:
  contents: write
jobs:
  collecte:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le site
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collecter les evenements
        run: node collecte-evenements.cjs

      - name: Enregistrer les nouveaux evenements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evenements-a-venir.json
          git diff --cached --quiet || (git commit -m "Mise a jour automatique des evenements" && git push)
